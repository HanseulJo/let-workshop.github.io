# ─────────────────────────────────────────────────────────────
# The formulas the hero is written in.
#
# A flat list of LaTeX, nothing else — order is irrelevant, the
# hero shuffles them. tools/prep-formulas.py renders each one to a
# vector outline, so the page ships no maths renderer and no
# webfont for this.
#
# Adding one: write the LaTeX, re-run prep-formulas.py, then
# formula-lut.py and formula-art.py, and rebuild. They are drawn by
# matplotlib's mathtext, which covers most of amsmath but not
# everything; the tool says if one fails.
#
# WHAT BELONGS HERE. Every line has to be a thing someone in this
# room would recognise on sight: a theorem, a bound, a definition
# that names an object, an objective, or the formulation of a
# problem. Nothing that is only notation (`N(F, e, ||.||)` says
# nothing without its sentence), nothing that restates a line
# already present in weaker form, and nothing so elementary it
# carries no information at this gathering — max{0, z} is the ReLU
# and everyone here has known that for a decade.
#
# The reason is not taste. Every formula is a tile in the picture,
# and a reader who stops on one gets exactly one sentence out of
# the page. Spending that sentence on a definition of the spectral
# norm is a waste of the only attention the background will ever
# get.
#
# The set spans the three parts of learning theory the way
# Telegarsky's notes divide them — approximation, optimization,
# generalization — plus the topics LET lists and the subjects this
# year's speakers are actually talking about.
# ─────────────────────────────────────────────────────────────

formulas:
  # ---- What is being learned, and what "well" means
  - 'x \mapsto \sum_{j=1}^m a_j \sigma(w_j^\top x + b_j)'
  - 'f(x;w) = \sigma_L(W_L \cdots \sigma_1(W_1 x + b_1) \cdots)'
  - '\widehat{\mathcal{R}}(f) = \frac{1}{n}\sum_i \ell(f(x_i), y_i)'
  - '\mathcal{R}(f) = \mathbb{E}\,\ell(f(x), y)'
  - '\ell(z) = \ln(1 + e^{-z})'

  # ---- Approximation
  - '\|f\|_{\mathcal{B}} = \int \|w\|\,|\hat f(w)|\,dw'
  - 'f(x) = \int e^{i\langle w, x\rangle} \hat f(w)\, dw'
  - '\Theta(x, x'') = \langle \nabla_w f(x), \nabla_w f(x'') \rangle'
  - 'f(x; w) \approx f(x; w_0) + \langle \nabla f(x; w_0), w - w_0 \rangle'

  # ---- Optimization
  - 'w_{t+1} = w_t - \eta \nabla \mathcal{R}(w_t)'
  - '\mathbb{E}\|\nabla \mathcal{R}(w_t)\|^2 \leq \frac{2\beta}{T}'
  - '\mathcal{R}(w) - \mathcal{R}^\star \leq \frac{\|w_0 - w^\star\|^2}{2\eta T}'
  - '\|\nabla \mathcal{R}(u) - \nabla \mathcal{R}(v)\| \leq \beta \|u - v\|'
  - '\mathcal{R}(v) \geq \mathcal{R}(u) + \langle \nabla \mathcal{R}(u), v-u\rangle + \frac{\lambda}{2}\|v-u\|^2'
  - '\dot w(t) = -\nabla \mathcal{R}(w(t))'
  - '\partial f(w) = \mathrm{conv}\{\lim \nabla f(w_i)\}'
  - 'f(cw) = c^L f(w)'
  - '\gamma(w) = \min_i \frac{y_i f(x_i; w)}{\|w\|^L}'

  # ---- Generalization
  - '\mathfrak{R}(\mathcal{F}) = \mathbb{E}_\epsilon \sup_{f} \frac{1}{n}\sum_i \epsilon_i f(x_i)'
  - '\Pr[|\bar X - \mu| \geq t] \leq 2e^{-2nt^2}'
  - '\mathbb{E}\,e^{\lambda(X-\mu)} \leq e^{\lambda^2\sigma^2/2}'
  - '\mathcal{R}(f) \leq \widehat{\mathcal{R}}(f) + 2\mathfrak{R}(\mathcal{F}) + \sqrt{\frac{\ln(1/\delta)}{2n}}'
  - '\mathfrak{R}(\mathcal{F}) \leq \inf_\alpha \left(4\alpha + 12\int_\alpha^\infty \sqrt{\frac{\ln N(\epsilon)}{n}}\,d\epsilon\right)'
  - '\mathrm{VC}(\mathcal{H}) = O(WL\log W)'

  # ---- Bandits, RL, decision-making
  - '\mathrm{Reg}(T) = \sum_{t=1}^T (\mu^\star - \mu_{a_t})'
  - 'a_t = \arg\max_a \left(\hat\mu_a + \sqrt{\frac{2\ln t}{n_a}}\right)'
  - 'Q^\star(s,a) = r(s,a) + \gamma \mathbb{E}\max_{a''} Q^\star(s'',a'')'
  - 'V^\pi(s) = \mathbb{E}\left[\sum_t \gamma^t r_t \mid s_0 = s\right]'
  - '\mathrm{Reg}(T) = \tilde O(\sqrt{dT})'
  - 'q_a(\tau) = \inf\{z : F_a(z) \geq \tau\}'

  # ---- Logistic and generalized linear bandits
  # Junghyun Lee''s line of work, which is where several of this year''s bandit
  # talks sit: the self-concordance constant kappa and how to stop paying for it.
  #   arXiv:2310.18554  regret-to-confidence-set conversion
  #   arXiv:2506.03074  GL-LowPopArt, low-rank trace regression
  - 'r_t \sim \mathrm{Ber}(\mu(\langle x_t, \theta_\star \rangle))'
  - '\mu(z) = (1 + e^{-z})^{-1}'
  - '\kappa(T) = \max_{t, x, \theta} \frac{1}{\dot{\mu}(x^\top \theta)}'
  - '\mathcal{C}_t = \{\theta : \mathcal{L}_t(\theta) - \mathcal{L}_t(\hat\theta_t) \leq \beta_t^2\}'
  - '\mathrm{Reg}(T) \lesssim dS\sqrt{T / \kappa_\star(T)}'
  - 'p(i \mid x) = \frac{e^{x^\top \theta_i}}{\sum_j e^{x^\top \theta_j}}'
  - '\mathbb{E}[y \mid X] = \mu(\langle X, \Theta_\star \rangle)'
  - '\Theta_0 = \arg\min_\Theta \mathcal{L}_N(\Theta) + \lambda \|\Theta\|_{\mathrm{nuc}}'
  - 'o_t \sim \mathrm{Ber}(\mu(\phi_w^\top \Theta_\star \phi_\ell))'
  - '\Pr[y_1 \succ y_2] = \sigma(r(x, y_1) - r(x, y_2))'
  - 'w_{t+1} = \arg\min_w \eta \langle g_t, w \rangle + D_\Psi(w, w_t)'
  - 'D_\Psi(u, v) = \Psi(u) - \Psi(v) - \langle \nabla \Psi(v), u - v \rangle'

  # ---- Optimizers beyond plain SGD
  # AdamW rather than Adam: the decoupled decay is the part that is a claim
  # about optimization, and the bias correction it is built on is bookkeeping.
  - 'w_{t+1} = (1 - \eta\lambda) w_t - \eta \frac{\hat m_t}{\sqrt{\hat v_t} + \epsilon}'
  - 'w_{t+1} = w_t - \eta \nabla f(w_t) + \beta (w_t - w_{t-1})'
  - 'w_{t+1} = w_t - \eta\, \mathrm{sign}(\beta m_t + (1-\beta) g_t)'
  - '\arg\min_{\|\Delta\| \leq 1} \langle G, \Delta \rangle'
  # Muon: momentum, then the orthogonal polar factor of it
  - 'M_t = \mu M_{t-1} + G_t, \quad W_{t+1} = W_t - \eta\, O(M_t)'
  - 'O(M) = UV^\top = (MM^\top)^{-1/2} M'
  - 'X \leftarrow aX + b(XX^\top)X + c(XX^\top)^2 X'
  # Shampoo: full-matrix preconditioning, one factor per side
  - 'L_t = L_{t-1} + G_t G_t^\top'
  - 'W_{t+1} = W_t - \eta\, L_t^{-1/4} G_t R_t^{-1/4}'

  # ---- Distributed and federated optimization
  - '\min_w \frac{1}{N} \sum_{i=1}^N f_i(w)'
  - '\min_{w_i} \sum_i f_i(w_i) \;\; \mathrm{s.t.} \;\; w_i = z'
  - 'w^{r+1} = \sum_{i=1}^N \frac{n_i}{n} w_i^{r,K}'
  - 'w_i^{t+1} = \sum_{j \in \mathcal{N}_i} A_{ij} w_j^t'
  - '\rho = 1 - |\lambda_2(A)|'
  - '\zeta^2 = \sup_w \frac{1}{N} \sum_i \|\nabla f_i(w) - \nabla f(w)\|^2'
  - '\mathbb{E}\|\mathcal{C}(x) - x\|^2 \leq (1 - \delta)\|x\|^2'
  - 'e_i^{t+1} = p_i^t - \mathcal{C}(p_i^t)'
  - '\mathbb{E}\|\nabla f(\bar w)\|^2 = O\!\left(\frac{1}{\sqrt{NT}}\right)'

  # ---- Uncertainty quantification and calibration
  - 'p(y \mid x, \mathcal{D}) = \int p(y \mid x, \theta)\, p(\theta \mid \mathcal{D})\, d\theta'
  - '\mathrm{ECE} = \sum_b \frac{|B_b|}{n} \left| \mathrm{acc}(B_b) - \mathrm{conf}(B_b) \right|'
  - 'H[y \mid x] = -\sum_y p(y \mid x) \ln p(y \mid x)'
  - 'I(y; \theta \mid x) = H[\mathbb{E}_\theta\, p] - \mathbb{E}_\theta\, H[p]'
  - 'R(f, g) = \frac{\mathbb{E}[g(x)\, \ell(f(x), y)]}{\mathbb{E}[g(x)]}'

  # ---- Conformal prediction
  - '\Pr[y \in C(x)] \geq 1 - \alpha'
  - 'C(x) = \{y : s(x,y) \leq \hat q_{1-\alpha}\}'
  - '\hat q_{1-\alpha} = s_{(\lceil (n+1)(1-\alpha) \rceil)}'

  # ---- High-dimensional statistics
  - '\hat\beta = \arg\min_\beta \|y - X\beta\|^2 + \lambda\|\beta\|_1'
  - '\|\hat\beta - \beta^\star\|_2 \lesssim \sigma\sqrt{\frac{s\log d}{n}}'

  # ---- Bayesian methods, sampling, inference
  - 'p(\theta \mid x) \propto p(x \mid \theta)\, p(\theta)'
  - '\mathbb{E}[\theta_{n+1} \mid \mathcal{F}_n] = \theta_n'
  - 'dX_t = -\nabla U(X_t)\,dt + \sqrt{2}\,dB_t'
  - '\mathrm{KL}(q \,\|\, p) = \int q \ln \frac{q}{p}'

  # ---- Causality
  - '\mathbb{E}[Y \mid do(X = x)]'
  - 'Y = f(X, U), \quad X \perp\!\!\!\perp U'

  # ---- Learning under constraints
  - '\Pr[M(D) \in S] \leq e^{\varepsilon}\Pr[M(D'') \in S]'

  # ---- Empirical phenomena: flatness, distillation, edge of stability
  - '\min_w \max_{\|\epsilon\| \leq \rho} \mathcal{R}(w + \epsilon)'
  - '\mathcal{L} = \tau^2\, \mathrm{KL}(p_T^\tau \,\|\, p_S^\tau)'
  - '\lambda_{\max}(\nabla^2 \mathcal{R}) \leq 2/\eta'
